name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Controle des secrets client (porte pre-build)
        run: npm run check:secrets
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests d'architecture (invariants I1-I4, ADR-001, securite)
        run: npm run test:arch
      - name: Tests
        run: npm test
      - name: Build (enchaine prebuild et postbuild)
        run: npm run build
