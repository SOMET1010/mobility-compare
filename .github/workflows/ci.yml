name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet requis : tests/architecture/secrets.test.ts
          # scanne « git log -p --all » pour vérifier que chaque exception
          # historique du détecteur de secrets correspond encore à une occurrence
          # réelle. Le checkout par défaut est shallow (depth 1) : il prive ce
          # contrôle de l'historique et le fait échouer à tort. On ne desserre
          # pas le contrôle — on lui fournit les données qu'il inspecte.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Controle des secrets client (porte pre-build)
        run: npm run check:secrets
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests d'architecture (invariants I1-I4, ADR-001, securite)
        run: npm run test:arch
      - name: Tests
        run: npm test
      - name: Build (enchaine prebuild et postbuild)
        run: npm run build

  e2e:
    # Smoke tests Playwright : chargement du shell sans erreur console + absence
    # de secret dans le bundle servi. Aucune dependance a OSRM ni a DEP-001 :
    # ces tests ne chargent que le shell, qui n'appelle aucun service de routage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Version de Playwright (cle de cache)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache des navigateurs Playwright
        # Cache fiable : la cle est liee a la version exacte de Playwright, donc
        # une montee de version invalide le cache. `playwright install` reste
        # lance ensuite et devient un no-op en cas de restauration complete.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Installer Chromium (deterministe)
        run: npx playwright install --with-deps chromium
      - name: Smoke tests e2e (build + preview + attente + 2 tests)
        # Le webServer de playwright.config.ts construit puis sert l'application
        # et attend explicitement http://localhost:4173 avant d'executer.
        run: npm run test:e2e
      - name: Conserver traces, captures et rapport — en cas d'echec uniquement
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
