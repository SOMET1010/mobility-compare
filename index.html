<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Nom provisoire (ADR-001) mais assumé : c'est celui que voient les usagers. -->
    <title>MOBILIS — On va où ? Comparez les prix à Abidjan</title>
    <meta
      name="description"
      content="VTC, taxi compteur, woro-woro, gbaka : comparez les prix et durées de votre trajet à Abidjan. Neutre, gratuit, calcul visible."
    />
    <!-- Cartes de partage (Facebook, TikTok, WhatsApp, X…) : le lien doit être beau quand il circule. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MOBILIS" />
    <meta property="og:title" content="On va où ? Comparez les prix avant de partir." />
    <meta
      property="og:description"
      content="VTC, taxi compteur, woro-woro, gbaka : les prix et durées de votre trajet à Abidjan, comparés en toute neutralité."
    />
    <meta property="og:url" content="https://mobility-compare.pages.dev/" />
    <meta property="og:image" content="https://mobility-compare.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_CI" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Identite PROVISOIRE (piste « Voies qui convergent », variante A).
      Le SVG est prioritaire ; favicon.ico reste un repli pour les vieux navigateurs.
      A remplacer avec la marque definitive (ADR-001 / DEP-007).
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-app.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F3EEDF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#26301C" media="(prefers-color-scheme: dark)" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
