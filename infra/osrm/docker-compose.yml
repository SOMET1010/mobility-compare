# OSRM auto-hébergé — Côte d'Ivoire (DEP-001).
# Usage : ./setup.sh prépare les données, puis `docker compose up -d`.
# Le frontend n'appelle JAMAIS ce service directement (CDC §7) : il sera
# consommé par notre couche de services (authentification, quotas, journaux).
services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld /data/ivory-coast-latest.osrm
    volumes:
      - ./data:/data
    ports:
      # Écoute locale uniquement : l'exposition publique passera par la
      # couche de services (reverse proxy authentifié), pas par ce port.
      - '127.0.0.1:5000:5000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-sf',
          'http://localhost:5000/route/v1/driving/-4.017,5.32;-3.983,5.359',
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Géocodage auto-hébergé (recherche d'adresses et de lieux) — même extrait
  # OpenStreetMap que le routage, réutilisé tel quel. Premier démarrage :
  # import de la base (~20-60 min), puis service de recherche. Jamais exposé
  # directement : Caddy le sert sous /geocodage/* , jeton obligatoire.
  # Les recherches des usagers ne quittent JAMAIS notre infrastructure.
  nominatim:
    image: mediagis/nominatim:4.4
    environment:
      PBF_PATH: /osm/ivory-coast-latest.osm.pbf
      NOMINATIM_PASSWORD: ${MDP_GEOCODAGE:-geocodage-interne}
      IMPORT_STYLE: full
      THREADS: '4'
      # Base figée après import : plus légère, lecture seule — l'actualisation
      # passe par une réimportation (même cadence que les données OSRM).
      FREEZE: 'true'
    volumes:
      - ./data:/osm:ro
      - geocodage_data:/var/lib/postgresql/14/main
    shm_size: 1g
    restart: unless-stopped

  # Exposition publique sécurisée — activée seulement quand un domaine existe :
  #   DOMAINE_ROUTAGE=routage.mondomaine.ci JETON_ROUTAGE=<secret> \
  #   docker compose --profile public up -d
  # TLS automatique (Let's Encrypt) ; toute requête sans le jeton → 401.
  # Défauts vides (`:-`) : compose interpole ces variables même quand le
  # profil n'est pas activé — elles ne doivent être exigées qu'à
  # l'activation du profil public, pas au lancement du service osrm seul.
  caddy:
    image: caddy:2
    profiles: ['public']
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAINE_ROUTAGE: ${DOMAINE_ROUTAGE:-}
      JETON_ROUTAGE: ${JETON_ROUTAGE:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
  geocodage_data:
