<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="MobilityCompare (identite provisoire)">
  <!--
    IDENTITE PROVISOIRE — piste « Voies qui convergent », variante A (convergence radiale).
    Six voies symetriques convergent vers un point de decision unique : aucun mode
    ni operateur n'est privilegie (doctrine de neutralite). Provisoire jusqu'a ADR-001 / DEP-007.
    Le trait suit la couleur du navigateur (clair/sombre) ; le point central est « Soleil » #B9722A.
  -->
  <style>
    .stroke { stroke: #26301C; stroke-width: 3; stroke-linecap: round; fill: none; }
    @media (prefers-color-scheme: dark) { .stroke { stroke: #EAF1EE; } }
  </style>
  <g class="stroke">
    <line x1="24" y1="4"    x2="24"   y2="17"/>
    <line x1="41.3" y1="14" x2="30.5" y2="20.5"/>
    <line x1="41.3" y1="34" x2="30.5" y2="27.5"/>
    <line x1="24" y1="44"   x2="24"   y2="31"/>
    <line x1="6.7" y1="34"  x2="17.5" y2="27.5"/>
    <line x1="6.7" y1="14"  x2="17.5" y2="20.5"/>
  </g>
  <circle cx="24" cy="24" r="4.2" fill="#B9722A"/>
</svg>
