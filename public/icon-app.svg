<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="MobilityCompare (identite provisoire)">
  <!--
    IDENTITE PROVISOIRE — icone d'application (mobile / PWA), variante A.
    Marque « maskable » : le motif tient dans la zone de securite centrale (~60 %),
    fond Encre #26301C, trait Papier #F3EEDF, point de decision Soleil #B9722A.
    Provisoire jusqu'a ADR-001 / DEP-007.
  -->
  <rect x="0" y="0" width="48" height="48" rx="10" fill="#26301C"/>
  <g transform="translate(24 24) scale(0.62) translate(-24 -24)">
    <g fill="none" stroke="#F3EEDF" stroke-width="3" stroke-linecap="round">
      <line x1="24" y1="4"    x2="24"   y2="17"/>
      <line x1="24" y1="44"   x2="24"   y2="31"/>
      <line x1="4"  y1="24"   x2="17"   y2="24"/>
      <line x1="44" y1="24"   x2="31"   y2="24"/>
      <line x1="9.9"  y1="9.9"  x2="19.1" y2="19.1"/>
      <line x1="38.1" y1="38.1" x2="28.9" y2="28.9"/>
      <line x1="38.1" y1="9.9"  x2="28.9" y2="19.1"/>
      <line x1="9.9"  y1="38.1" x2="19.1" y2="28.9"/>
    </g>
    <circle cx="24" cy="24" r="4.4" fill="#B9722A"/>
  </g>
</svg>
